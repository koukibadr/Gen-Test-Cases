name: "Gen Test Cases"
description: "Generate UAT test cases (happy, negative, edge) from a GitHub issue with any AI model, and post them on the issue."
author: "Badreddine Kouki"
branding:
  icon: "life-buoy"
  color: "green"

inputs:
  # ---- Model ----
  provider:
    description: "AI provider: anthropic, openai, xai, gemini, openrouter, groq, mistral, deepseek, or custom (set base-url)."
    required: false
    default: "anthropic"
  model:
    description: "Model name for the provider, e.g. claude-sonnet-4-6, gpt-5, grok-4, gemini-2.5-pro."
    required: true
  api-key:
    description: "API key for the provider. Pass it from a secret."
    required: true
  base-url:
    description: "OpenAI-compatible base URL. Overrides the provider preset; required when provider is custom (e.g. http://localhost:11434/v1 for Ollama)."
    required: false
    default: ""

  # ---- Issue ----
  issue-number:
    description: "Issue to generate test cases for. Defaults to the issue that triggered the workflow."
    required: false
    default: ${{ github.event.issue.number }}
  issue-title:
    description: "Issue title. Defaults to the triggering issue."
    required: false
    default: ${{ github.event.issue.title }}
  issue-body:
    description: "Issue description. Defaults to the triggering issue."
    required: false
    default: ${{ github.event.issue.body }}

  # ---- Output ----
  commit:
    description: "Also commit the cases file to the repository (true/false). The cases are always posted on the issue."
    required: false
    default: "false"
  commit-branch:
    description: "Branch to push the commit to. Defaults to the checked-out branch."
    required: false
    default: ""
  output-dir:
    description: "Folder for the cases file, relative to the repository root."
    required: false
    default: "e2e/cases"
  max-cases:
    description: "Maximum number of test cases per issue."
    required: false
    default: "25"
  max-tokens:
    description: "Maximum tokens the model may generate."
    required: false
    default: "8000"
  context-chars:
    description: "Maximum characters of repository context sent to the model."
    required: false
    default: "60000"
  github-token:
    description: "Token used to read and write the issue comment (and push when commit is true)."
    required: false
    default: ${{ github.token }}

outputs:
  result:
    description: "ok, or needs_clarification when some acceptance criteria could not be tested as written."
    value: ${{ steps.generate.outputs.result }}
  total:
    description: "Number of test cases."
    value: ${{ steps.generate.outputs.total }}
  blocking:
    description: "Number of blocking test cases."
    value: ${{ steps.generate.outputs.blocking }}
  cases-file:
    description: "Path of the generated cases file in the workspace."
    value: ${{ steps.generate.outputs.cases-file }}
  comment-url:
    description: "URL of the issue comment holding the test cases."
    value: ${{ steps.comment.outputs.comment-url }}

runs:
  using: "composite"
  steps:
    - name: Install action dependencies
      shell: bash
      run: npm ci --omit=dev --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH" >/dev/null

    - name: Generate test cases
      id: generate
      shell: bash
      env:
        GTC_PROVIDER: ${{ inputs.provider }}
        GTC_MODEL: ${{ inputs.model }}
        GTC_API_KEY: ${{ inputs.api-key }}
        GTC_BASE_URL: ${{ inputs.base-url }}
        GTC_ISSUE_NUMBER: ${{ inputs.issue-number }}
        GTC_ISSUE_TITLE: ${{ inputs.issue-title }}
        GTC_ISSUE_BODY: ${{ inputs.issue-body }}
        GTC_OUTPUT_DIR: ${{ inputs.output-dir }}
        GTC_MAX_CASES: ${{ inputs.max-cases }}
        GTC_MAX_TOKENS: ${{ inputs.max-tokens }}
        GTC_CONTEXT_CHARS: ${{ inputs.context-chars }}
        GTC_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/src/generate.mjs"

    - name: Upload cases file
      uses: actions/upload-artifact@v4
      with:
        name: test-cases-issue-${{ inputs.issue-number }}
        path: ${{ steps.generate.outputs.cases-file }}
        overwrite: true

    - name: Post test cases on the issue
      id: comment
      shell: bash
      env:
        GTC_ISSUE_NUMBER: ${{ inputs.issue-number }}
        GTC_GITHUB_TOKEN: ${{ inputs.github-token }}
        GTC_COMMENT_FILE: ${{ steps.generate.outputs.comment-file }}
      run: node "$GITHUB_ACTION_PATH/src/comment.mjs"

    - name: Commit cases file
      if: inputs.commit == 'true'
      shell: bash
      env:
        CASES_FILE: ${{ steps.generate.outputs.cases-file }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        COMMIT_BRANCH: ${{ inputs.commit-branch }}
      run: |
        set -euo pipefail
        branch="${COMMIT_BRANCH:-$(git rev-parse --abbrev-ref HEAD)}"
        if [ "$branch" = "HEAD" ]; then
          echo "::error::The checkout is a detached HEAD; set the commit-branch input to choose where to push."
          exit 1
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- "$CASES_FILE"
        if git diff --cached --quiet; then
          echo "::notice::Test cases unchanged, nothing to commit."
          exit 0
        fi
        git commit -q -m "test(#$ISSUE_NUMBER): add UAT test cases"
        git push -q origin "HEAD:$branch"
        echo "Committed $CASES_FILE to $branch"
